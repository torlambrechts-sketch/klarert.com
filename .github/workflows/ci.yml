name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migration smoke test (PGlite)
        run: pnpm db:smoke

      - name: Start Supabase
        run: pnpm supabase:start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Migrations apply from scratch
        run: pnpm db:reset

      - name: Database tests (pgTAP)
        run: pnpm db:test

      - name: Generated types are up to date
        run: pnpm db:types && git diff --exit-code src/lib/database.types.ts

      - name: Local environment
        run: |
          pnpm exec supabase status -o env | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' > .env.local
          echo 'NEXT_PUBLIC_APP_URL=http://localhost:3000' >> .env.local
          echo "CRON_SECRET=$(openssl rand -hex 24)" >> .env.local

      - name: Seed
        run: pnpm seed

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
