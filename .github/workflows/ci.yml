name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Three jobs run side by side, so one failing step never hides the others (docs/09 §8.6). Protect main by requiring
# all three: README.md › Branch protection.
jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migration smoke test (PGlite)
        run: pnpm db:smoke

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: ./scripts/ci/supabase-start.sh

      - name: Migrations apply from scratch
        run: pnpm db:reset

      - name: Database tests (pgTAP)
        run: pnpm db:test

      - name: Generated types are up to date
        run: |
          if ! pnpm db:types:check; then
            echo "::error file=src/lib/database.types.ts::Generated types differ from the migrations. Run 'pnpm db:reset && pnpm db:types' and commit src/lib/database.types.ts, or download the 'database-types' artifact of this run and commit it. Never edit the file by hand."
            exit 1
          fi

      - name: Upload the generated types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/lib/database.types.ts
          retention-days: 7

  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # the suite (about 400 tests, one worker) took about an hour in one job; four shards, each with its own
    # Supabase and seed, run it in about a quarter of that (owner decision 18 Nov 2026)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase
        run: ./scripts/ci/supabase-start.sh

      - name: Migrations apply from scratch
        run: pnpm db:reset

      - name: Local environment
        run: |
          pnpm exec supabase status -o env | sed -n \
            -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
            -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' > .env.local
          echo 'NEXT_PUBLIC_APP_URL=http://localhost:3000' >> .env.local
          echo "CRON_SECRET=$(openssl rand -hex 24)" >> .env.local
          echo "FORM_RATE_LIMIT_SALT=$(openssl rand -hex 32)" >> .env.local

      - name: Seed
        run: pnpm seed

      - name: Install Playwright browsers (Chromium and its headless shell)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: No service-role key in client bundles
        run: pnpm security:bundle

      - name: End-to-end tests
        # the scroll-performance budget runs nightly instead (perf.yml): frame times are noisy on shared runners
        run: pnpm e2e --project=chromium --project=phone --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # one check named e2e, as before: green only when every shard is
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-shard.result }}" = "success"
