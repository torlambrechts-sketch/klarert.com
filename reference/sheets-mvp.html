<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: top bar, sheet sidebar, main canvas. Petrol accent, cool neutrals, vivid label colours for statuses. */
:root{
 --bg:#F4F6F7;--surface:#FFFFFF;--ink:#13202A;--muted:#5A6874;--line:#DCE2E6;--soft:#EEF2F4;
 --accent:#0B6E79;--accent-soft:#E0F0F1;--accent-ink:#FFFFFF;
 --good:#1E8449;--good-soft:#E3F4EA;--warn:#A86A12;--warn-soft:#FBF0DC;--crit:#BE3A31;--crit-soft:#FBE6E4;--info:#3456A8;--info-soft:#E6ECF8;
 --h1:#DDF1E4;--h1i:#165E35;--h2:#FBEFC9;--h2i:#7A5308;--h3:#FCDCC3;--h3i:#8A3D0A;--h4:#F6C9C4;--h4i:#8E1F18;
 --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --lb-green:#188A50;--lb-orange:#C46A0A;--lb-red:#C93A46;--lb-blue:#2F6FD6;--lb-purple:#7E52C6;--lb-teal:#0B8389;--lb-navy:#2F4F8F;--lb-yellow:#E5B526;--lb-grey:#B4BCC4;--lb-pink:#C24E88;--lb-dark:#55606B;
 color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0D1419;--surface:#141E26;--ink:#E4EBF0;--muted:#94A3AF;--line:#25323C;--soft:#1A2630;--accent:#3FB0BB;--accent-soft:#11343A;--accent-ink:#06191C;
 --good:#56C487;--good-soft:#123222;--warn:#E3AB4C;--warn-soft:#352812;--crit:#F2766C;--crit-soft:#3A1916;--info:#86A5EE;--info-soft:#18233F;
 --h1:#14382A;--h1i:#8FE0B1;--h2:#3A3112;--h2i:#F0CF78;--h3:#41260F;--h3i:#F5AE7A;--h4:#4A1A17;--h4i:#FF9A90;color-scheme:dark;}}
:root[data-theme="dark"]{
 --bg:#0D1419;--surface:#141E26;--ink:#E4EBF0;--muted:#94A3AF;--line:#25323C;--soft:#1A2630;--accent:#3FB0BB;--accent-soft:#11343A;--accent-ink:#06191C;
 --good:#56C487;--good-soft:#123222;--warn:#E3AB4C;--warn-soft:#352812;--crit:#F2766C;--crit-soft:#3A1916;--info:#86A5EE;--info-soft:#18233F;
 --h1:#14382A;--h1i:#8FE0B1;--h2:#3A3112;--h2i:#F0CF78;--h3:#41260F;--h3i:#F5AE7A;--h4:#4A1A17;--h4i:#FF9A90;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
a{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:600}h2{font-size:16px;font-weight:600}h3{font-size:14px;font-weight:600}
.mono{font-family:var(--font-mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.lb-green,.lb-orange,.lb-red,.lb-blue,.lb-purple,.lb-teal,.lb-navy,.lb-pink,.lb-dark{color:#fff!important}
.lb-yellow,.lb-grey{color:#1B2229!important}
.lb-green{background:var(--lb-green)!important}.lb-orange{background:var(--lb-orange)!important}.lb-red{background:var(--lb-red)!important}.lb-blue{background:var(--lb-blue)!important}.lb-purple{background:var(--lb-purple)!important}.lb-teal{background:var(--lb-teal)!important}.lb-navy{background:var(--lb-navy)!important}.lb-yellow{background:var(--lb-yellow)!important}.lb-grey{background:var(--lb-grey)!important}.lb-pink{background:var(--lb-pink)!important}.lb-dark{background:var(--lb-dark)!important}
.lb-empty{background:var(--soft)!important;color:var(--muted)!important}

/* Shell */
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.top .sp{flex:1}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 53px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.side a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13.5px}
.side a:hover{background:var(--soft)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side a .tag{margin-left:auto;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.side a .tag.hot{background:var(--crit);border-color:var(--crit);color:#fff}
.bi{width:12px;height:11px;border:1.5px solid currentColor;border-radius:2px;flex:none;opacity:.65;background:linear-gradient(currentColor,currentColor) 0 3px/100% 1.5px no-repeat,linear-gradient(currentColor,currentColor) 4px 0/1.5px 100% no-repeat}
.dot{width:7px;height:7px;border-radius:2px;background:var(--line);flex:none}
main{padding:20px;min-width:0;display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h2{margin-bottom:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.acc{background:var(--accent-soft);color:var(--accent)}.chip.line{background:transparent;border-color:var(--line)}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;background:var(--info-soft);color:var(--info);flex:none}
.av.b{background:var(--good-soft);color:var(--good)}.av.c{background:var(--warn-soft);color:var(--warn)}.av.d{background:var(--crit-soft);color:var(--crit)}.av.e{background:var(--accent-soft);color:var(--accent)}
.avs{display:inline-flex;align-items:center}.avs .av+.av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}
.sel,.inp{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink)}
textarea.inp{width:100%;min-height:72px;resize:vertical}
.list .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .row .grow{flex:1;min-width:0}
.list .row small{display:block;color:var(--muted);font-size:12px}
.tbl{border-collapse:collapse;width:100%}
.tbl th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.scroll{overflow-x:auto}
.empty-state{border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}

/* Sheet header and views */
.bhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.btitle{font-size:24px;font-weight:600;outline:none;border-radius:4px;padding:0 3px;margin-left:-3px}
[contenteditable="true"]:hover,[contenteditable="true"]:focus{box-shadow:0 0 0 1px var(--line)}
.bdesc{margin:4px 0 0;color:var(--muted);max-width:80ch;outline:none;border-radius:4px;padding:0 3px;margin-left:-3px}
.vt{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:flex-end}
.vt button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.vt button:hover{color:var(--ink)}
.vt button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.bsearch{border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;width:200px}
.bwrap{overflow-x:auto;padding-bottom:8px}
.gblock{margin-bottom:20px}
.gtitle{display:flex;align-items:center;gap:8px;padding:4px 0 6px;position:sticky;left:0;width:max-content}
.gname{color:var(--g);font-weight:600;font-size:16px;outline:none;padding:0 3px;border-radius:4px}
.gcount{font-size:12px;color:var(--muted)}
.caret{width:22px;height:22px;border:0;background:none;cursor:pointer;position:relative;border-radius:4px}
.caret:hover{background:var(--soft)}
.caret::before{content:"";position:absolute;left:6px;top:8px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--g);transition:transform .15s}
.caret.shut::before{transform:rotate(-90deg)}
.gdot{width:12px;height:12px;border-radius:3px;background:var(--g);border:0;cursor:pointer;padding:0}
table.bt{border-collapse:separate;border-spacing:0;table-layout:fixed}
.bt th,.bt td{height:36px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:var(--surface);padding:0 6px;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.bt th{font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;height:34px}
.bt th:hover{color:var(--ink);background:var(--soft)}
.bt th .fl{display:inline-flex;gap:3px;margin-left:4px;vertical-align:1px}
.bt th .fl i{font-style:normal;font-size:9.5px;font-weight:600;border:1px solid currentColor;border-radius:3px;padding:0 3px;line-height:13px;opacity:.75}
.bt .nm{position:sticky;left:0;z-index:2;text-align:left;border-left:6px solid var(--g)}
.bt thead th.nm{cursor:default;border-top-left-radius:6px}
.bt thead th.nm:hover{background:var(--surface);color:var(--muted)}
.bt tr.item:hover td:not(.lab){background:var(--soft)}
.bt tr.addrow td{border-bottom:1px solid var(--line)}
.bt td.lab{font-weight:600;font-size:12.5px;cursor:pointer;border-right-color:var(--surface)}
.bt td[data-act]{cursor:pointer}
.bt td.tx{text-align:left}
.bt td.fx{color:var(--muted)}
.bt td.ro{cursor:default}
.bt td.inv::after{content:"";position:absolute;top:0;right:0;border-top:9px solid var(--crit);border-left:9px solid transparent}
.bt th.addc{font-size:18px;color:var(--muted)}
.bt tr.sumrow td{border:0;background:var(--bg);height:34px}
.bt tr.sumrow td.nm{border-left:0}
.nmw{display:flex;align-items:center;gap:8px}
.iid{color:var(--muted);font-size:11px;flex:none;font-family:var(--font-mono)}
.iname{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iname:hover{color:var(--accent);text-decoration:underline}
.updb{flex:none;min-width:26px;height:20px;border:1px solid var(--line);border-radius:5px;background:none;color:var(--muted);font-size:11px;cursor:pointer}
.updb.has{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.issb{flex:none;font-size:10.5px;font-weight:700;color:#fff;background:var(--crit);border-radius:4px;padding:0 5px;border:0;cursor:pointer}
.lk-i{display:inline-block;width:8px;height:9px;border:1.5px solid var(--muted);border-radius:2px;flex:none}
.addin{width:100%;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);outline:none}
.addin::placeholder{color:var(--muted)}
.bat{display:flex;height:22px;border-radius:3px;overflow:hidden;margin:0 2px}
.bat i{display:block;height:100%}
.sumv{font-size:12px;font-weight:600}
.sumv small{display:block;font-weight:400;color:var(--muted);font-size:10.5px;line-height:1}
.dd{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--soft);font-size:12px}
.tg{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--info-soft);color:var(--info);font-size:11.5px;margin:0 2px}
.tg.sp{background:var(--crit-soft);color:var(--crit)}
.rl{display:inline-block;padding:1px 6px;border-radius:4px;border:1px solid var(--line);font-size:11px;font-family:var(--font-mono);margin:0 2px}
.mir{color:var(--muted);font-size:12.5px}
.od{color:var(--crit);font-weight:600}
.tlb{display:inline-block;position:relative;width:100%;height:22px;border-radius:999px;background:#5F6B75;overflow:hidden;vertical-align:middle}
.tlb i{position:absolute;left:0;top:0;bottom:0;background:var(--g)}
.tlb b{position:relative;font-size:11.5px;font-weight:600;color:#fff;line-height:22px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.crit i{background:var(--crit)}
.pg{display:flex;align-items:center;gap:6px}.pg .bar{flex:1}
.cb{display:inline-block;width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;vertical-align:middle;position:relative}
.cb.on{background:var(--good);border-color:var(--good)}
.cb.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--line)}
.fdot.ok{background:var(--good)}.fdot.exp{background:var(--warn)}.fdot.bad{background:var(--crit)}
.heat{display:inline-block;min-width:34px;text-align:center;font-weight:600;border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
.heat.l1{background:var(--h1);color:var(--h1i)}.heat.l2{background:var(--h2);color:var(--h2i)}.heat.l3{background:var(--h3);color:var(--h3i)}.heat.l4{background:var(--h4);color:var(--h4i)}
.stars{letter-spacing:2px;color:var(--warn);font-size:11px}
.stars i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--line);margin-right:2px}
.stars i.on{background:var(--warn)}
.cbtn{display:inline-block;padding:3px 10px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600}
.spark{vertical-align:middle}
.mask{letter-spacing:2px;color:var(--muted)}
.clk{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.clk.run{background:var(--info-soft);color:var(--info)}.clk.warn{background:var(--warn-soft);color:var(--warn)}.clk.over,.clk.missed{background:var(--crit-soft);color:var(--crit)}.clk.met{background:var(--good-soft);color:var(--good)}.clk.idle{background:var(--soft);color:var(--muted)}

/* Kanban, timeline, calendar, chart, form */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.lane{flex:0 0 250px;background:var(--soft);border-radius:8px;min-height:140px;padding-bottom:8px}
.lane h3{padding:8px 10px;border-radius:8px 8px 0 0;font-size:13px;display:flex;justify-content:space-between}
.lane.drop{outline:2px dashed var(--accent)}
.kcard{background:var(--surface);margin:8px 8px 0;border-radius:6px;padding:9px 10px;border-left:4px solid var(--g);box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:grab;display:flex;flex-direction:column;gap:6px;font-size:13px}
.kcard .km{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.tl{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow-x:auto}
.tlg{min-width:980px}
.tlr{display:grid;grid-template-columns:280px 1fr;border-top:1px solid var(--line)}
.tlr:first-child{border-top:0}
.tlr .n{padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;cursor:pointer;height:34px}
.tlr .tr{position:relative;height:34px}
.tlh .tr{display:flex}
.tlm{flex:1;font-size:11.5px;color:var(--muted);padding:9px 6px;border-left:1px solid var(--line)}
.tlbar{position:absolute;top:8px;height:18px;border-radius:999px;background:var(--g);color:#fff;font-size:11px;padding:0 8px;line-height:18px;white-space:nowrap;overflow:hidden;cursor:pointer;min-width:8px;border:0;font-family:inherit}
.tlms{position:absolute;top:10px;width:13px;height:13px;transform:rotate(45deg);background:var(--g);cursor:pointer;border-radius:2px;border:0;padding:0}
.tlnow{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);opacity:.7}
.tlgh{padding:8px 10px;font-weight:600;color:var(--g);border-top:1px solid var(--line);background:var(--soft)}
.calw{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.calh{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px;flex-wrap:wrap}
.calwrap{overflow-x:auto}
.calg{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr))}
.calg .dn{font-size:11.5px;color:var(--muted);padding:6px 8px;border-top:1px solid var(--line)}
.calg .dc{min-height:94px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.calg .dc b{font-size:12px;font-weight:500;color:var(--muted);align-self:flex-start;padding:0 6px}
.calg .dc.today b{color:var(--accent-ink);background:var(--accent);border-radius:999px}
.calg .ev{font-size:11.5px;color:#fff;background:var(--g);border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;font-family:inherit}
.chb{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.chb .tr{height:22px;background:var(--soft);border-radius:4px;overflow:hidden}
.chb .tr i{display:block;height:100%}
.form{max-width:640px;display:flex;flex-direction:column;gap:14px}
.ff{display:flex;flex-direction:column;gap:5px}
.ff label{font-weight:600;font-size:13px}
.ff .help{font-size:12px;color:var(--muted)}
.ff .val{min-height:34px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);cursor:pointer;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ff .val:hover{border-color:var(--accent)}
.ff.bad .val{border-color:var(--crit)}
.req{color:var(--crit)}

/* Popover, drawer, modal, toast */
#pop{position:absolute;z-index:60;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,20,30,.22);padding:8px;min-width:230px;max-width:400px;max-height:70vh;overflow-y:auto}
#pop[hidden]{display:none}
.pl{display:block;width:100%;border:0;border-radius:5px;padding:7px 8px;margin:3px 0;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;text-align:center}
.pl.sel{outline:2px solid var(--ink);outline-offset:1px}

<body>
<header class="top">
 <div class="brand"><div class="logo">CO</div><div>Sheets MVP<small>Spreadsheet core · fields · automations · triggers</small></div></div>
 <span class="sp"></span>
 <span class="note" id="savestate"></span>

 <select id="actas" class="sel" aria-label="Acting as role"><option>Admin</option><option>Editor</option><option>Viewer</option></select>

<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ================= Utilities ================= */
var LS_KEY="cos-sheets-mvp-v1";
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONF=["January","February","March","April","May","June","July","August","September","October","November","December"];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return ("0"+n).slice(-2);}
function uid(p){return (p||"x")+Math.random().toString(36).slice(2,8);}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function dOff(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d);}
function dtOff(h){var d=new Date(Date.now()+h*36e5);return ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}
function dn(s){var p=String(s).slice(0,10).split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5;}
function tdn(){return dn(todayStr());}
function dnToStr(n){var d=new Date(n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
function fmtD(s){if(!s)return "";var p=String(s).slice(0,10).split("-");if(p.length<3)return String(s);return (+p[2])+" "+MON[+p[1]-1]+(+p[0]!==new Date().getFullYear()?" "+p[0]:"");}
function fmtDT(s){if(!s)return "";return fmtD(s)+(String(s).length>10?" "+String(s).slice(11,16):"");}
function stamp(){var d=new Date();return fmtD(todayStr())+" "+pad(d.getHours())+":"+pad(d.getMinutes());}
function fmtN(n,dec){if(n===""||n==null||isNaN(n))return "";return Number(n).toLocaleString("en-GB",{maximumFractionDigits:dec==null?2:dec});}
function hh(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ("0000000"+(h>>>0).toString(16)).slice(-8);}
function clone(o){return o==null?o:JSON.parse(JSON.stringify(o));}
function isEmpty(v){return v===undefined||v===null||v===""||(Array.isArray(v)&&!v.length)||(typeof v==="object"&&!Array.isArray(v)&&!Object.keys(v).some(function(k){return v[k]!==""&&v[k]!=null&&!(Array.isArray(v[k])&&!v[k].length);}));}
function o(n,c,done){return {n:n,c:c,done:done?1:0};}
var COLORS=["green","orange","red","blue","purple","teal","navy","yellow","grey","pink","dark"];
var COUNTRIES=["United Kingdom","Ireland","Germany","France","Netherlands","Belgium","Luxembourg","Spain","Portugal","Italy","Poland","Czechia","Austria","Switzerland","Sweden","Norway","Denmark","Finland","United States","Canada","Mexico","Brazil","Australia","New Zealand","Singapore","India","Japan","South Africa","United Arab Emirates"];
var PD_CATS=[["Identity",0],["Contact details",0],["Financial",0],["Location",0],["Images",0],["Employment",0],["Health",1],["Biometric",1],["Religion or beliefs",1],["Trade union membership",1],["Allegations",0],["Criminal offences",1]];
var CURR={EUR:"€",GBP:"£",USD:"$",NOK:"kr ",SEK:"kr ",DKK:"kr ",CHF:"CHF "};
var MAT=["None","Initial","Repeatable","Defined","Managed","Optimised"];
var DUR_DAYS={hours:1/24,days:1,weeks:7,months:30.4,years:365};

/* ================= Field types (57) ================= */
var FAM={basic:"Basic input",choice:"Choice and people",comp:"Compliance",calc:"Linked, computed and system"};
var TYPES=[
 ["text","Text","basic","T","One line of text"],["longtext","Long text","basic","¶","Longer text with line breaks"],["comment","Comment","basic","C","A note kept with author and time"],
 ["number","Number","basic","#","A number with optional unit"],["value","Value","basic","€","An amount with currency"],["percent","Percentage","basic","%","0 to 100 %"],
 ["yesno","Yes / No","basic","Y/N","Yes, No or N/A"],["check","Checkbox","basic","✓","Ticked or not"],["date","Date","basic","D","A calendar date"],
 ["datetime","Date and time","basic","DT","Date and time"],["duration","Duration","basic","⏱","A length of time"],["timeline","Timeline","basic","TL","A start and end date"],
 ["recurrence","Recurrence","basic","↻","A repeating schedule with next date"],["rating","Rating","basic","★","A score on a scale"],["email","Email","basic","@","An email address"],
 ["phone","Phone","basic","☎","A phone number"],["url","URL","basic","URL","A web link"],["location","Location","basic","L","A site and place"],
 ["status","Status","choice","S","One coloured label; drives rules"],["dropdown","Dropdown","choice","DD","One option from a list"],["multiselect","Multi-select","choice","MS","Several options"],
 ["people","People","choice","P","One or more people"],["role","Role","choice","R","A role rather than a person"],["team","Team","choice","Tm","A team or department"],
 ["entity","Entity and site","choice","ES","Legal entity and site"],["country","Country","choice","Co","Country or jurisdiction"],["classification","Classification","choice","Cl","Level from a scheme"],
 ["severity","Severity","choice","Sv","Level with colour and order"],
 ["requirement","Requirement","comp","Rq","Clauses from the requirement library"],["controllink","Control link","comp","Ct","Controls from the control library"],["evidence","Evidence","comp","Ev","Files with hash, source and expiry"],
 ["attachment","Attachment","comp","At","Plain files"],["signature","Signature","comp","Sg","Who signed, when and for what"],["ack","Acknowledgement","comp","Ak","Who has read and confirmed"],
 ["justification","Justification","comp","J","Text required by another field’s value"],["applicability","Applicability","comp","Ap","Applicable or not, with reason"],["finding","Finding","comp","Fd","Audit verdict"],
 ["checklist","Checklist","comp","CL","Questions answered Yes, No or N/A"],["question","Question","comp","Q","One scored assessment question"],["riskmatrix","Risk matrix","comp","RM","Likelihood × impact with level"],
 ["maturity","Maturity","comp","M","Level 0 to 5"],["measurement","Measurement","comp","Me","Readings over time against a target"],["clock","Statutory clock","comp","⏰","Deadline counted from a trigger"],
 ["protected","Protected text","comp","🔒","Restricted text, masked for others"],["pdmarker","Personal data marker","comp","PD","Personal data categories held"],["retention","Retention","comp","Rt","When to delete, legal hold"],
 ["version","Version","comp","V","Version label with history"],
 ["link","Link to items","calc","↔","Two-way link to another sheet"],["lookup","Lookup","calc","Lk","Value from a linked item"],["rollup","Rollup","calc","Σ","Count, sum or share across links"],
 ["formula","Formula","calc","fx","Calculated from other fields"],["progress","Progress","calc","▰","Share done of a checklist or links"],["autoid","Auto ID","calc","ID","Item ID with prefix"],
 ["meta","Created and updated","calc","⌚","Who created or last changed it"],["workflowstep","Workflow step","calc","WS","Step set by automations"],["button","Button","calc","▶","Click to fire an automation"],
 ["ai","AI proposal","calc","AI","Suggested value a person accepts"]
];
var TY={};TYPES.forEach(function(t){TY[t[0]]={id:t[0],l:t[1],fam:t[2],ic:t[3],d:t[4]};});
var LABEL_T=["status","severity","finding","yesno","maturity","classification","workflowstep"];
var CHIP_T=["dropdown","role","team","country","entity"];
var MULTI_T=["multiselect","pdmarker","people"];
var LINK_T=["link","requirement","controllink"];
var COMPUTED_T=["lookup","rollup","formula","progress","autoid","meta","clock"];
var NUMERIC_T=["number","value","percent","rating","duration","riskmatrix","maturity","question","measurement","formula","rollup","progress","checklist"];
var DATE_T=["date","datetime","timeline","recurrence","retention"];
var W={text:180,longtext:220,comment:200,number:96,value:120,percent:96,yesno:90,check:76,date:104,datetime:140,duration:100,timeline:170,recurrence:170,rating:110,email:180,phone:130,url:170,location:170,status:140,dropdown:130,multiselect:180,people:96,role:140,team:120,entity:200,country:140,classification:130,severity:110,requirement:180,controllink:160,evidence:120,attachment:110,signature:170,ack:120,justification:200,applicability:150,finding:130,checklist:140,question:150,riskmatrix:110,maturity:130,measurement:150,clock:130,protected:140,pdmarker:180,retention:160,version:90,link:170,lookup:160,rollup:110,formula:110,progress:130,autoid:96,meta:150,workflowstep:130,button:150,ai:200};

function defOpts(t){switch(t){
 case "status":return [o("Not started","grey"),o("Working on it","orange"),o("Stuck","red"),o("Done","green",1)];
 case "dropdown":case "multiselect":return [o("Option 1","blue"),o("Option 2","purple"),o("Option 3","teal")];
 case "severity":return [o("Low","green"),o("Medium","yellow"),o("High","orange"),o("Critical","red")];
 case "classification":return [o("Public","green"),o("Internal","blue"),o("Confidential","orange"),o("Restricted","red")];
 case "finding":return [o("Conformity","green",1),o("Observation","blue"),o("Opportunity","teal"),o("Minor nonconformity","orange"),o("Major nonconformity","red")];
 case "workflowstep":return [o("Draft","grey"),o("Review","blue"),o("Approval","purple"),o("Done","green",1)];
}return null;}
function defCfg(t){switch(t){
 case "value":return {cur:"EUR"};case "rating":return {scale:5};case "evidence":return {valid:365};
 case "signature":return {meaning:"Approved",resign:1};case "checklist":return {lines:["First check","Second check","Third check"],noteOnNo:1};
 case "question":return {q:"How well is this in place?",opts:[{n:"Not in place",s:0},{n:"Partly",s:1},{n:"Fully",s:2}],weight:1};
 case "riskmatrix":return {size:5,bands:[4,9,15]};case "measurement":return {unit:"",target:"",dir:"down"};
 case "clock":return {start:"",hours:72,stop:""};case "retention":return {years:6,from:""};
 case "rollup":return {link:"",field:"",fn:"count"};case "formula":return {expr:""};case "lookup":return {link:"",field:""};
 case "progress":return {src:""};case "meta":return {which:"created"};case "button":return {label:"Run"};
 case "ai":return {target:"",src:""};case "justification":return {f:"",vals:[]};case "ack":return {aud:[]};
 case "link":return {sheet:""};case "requirement":return {sheet:"req"};case "controllink":return {sheet:"ctl"};
 case "duration":return {u:"days"};
}return {};}

/* ================= State ================= */
var DB=null;
function people(){return DB.people;}
function pname(k){if(k==="AU")return "Automation";var p=DB.people.find(function(x){return x.id===k;});return p?p.name:k;}
function prole(k){var p=DB.people.find(function(x){return x.id===k;});return p?p.job:"";}
function av(k){var p=DB.people.find(function(x){return x.id===k;});if(!p)return "";return '<span class="av '+(p.c||"")+'" title="'+esc(p.name+", "+p.job)+'">'+esc(p.id)+'</span>';}
function sites(){var r=[];DB.entities.forEach(function(e){e.sites.forEach(function(s){r.push(e.name+" · "+s);});});return r;}
function optsOf(f){switch(f.type){
 case "yesno":return [o("Yes","green",1),o("No","red"),o("N/A","grey",1)];
 case "maturity":return MAT.map(function(m,i){return o(i+" "+m,["grey","red","orange","yellow","blue","green"][i],i>=3);});
 case "role":return DB.jobs.map(function(r){return o(r,"blue");});
 case "team":return DB.teams.map(function(t){return o(t,"teal");});
 case "country":return COUNTRIES.map(function(c){return o(c,"navy");});
 case "entity":return sites().map(function(s){return o(s,"navy");});
 case "pdmarker":return PD_CATS.map(function(c){return o(c[0],c[1]?"red":"blue");});
 case "applicability":return [o("Applicable","teal",1),o("Not applicable","grey",1)];
}return f.opts||[];}
function optColor(f,n){var op=optsOf(f).find(function(x){return x.n===n;});return op?op.c:"grey";}
function S(id){return DB.sheets[id];}
function fld(s,id){if(!s)return null;for(var i=0;i<s.fields.length;i++){if(s.fields[i].id===id)return s.fields[i];}return null;}
function fldByName(s,n){n=String(n).trim().toLowerCase();return s.fields.find(function(f){return f.name.toLowerCase()===n;});}
function items(s){var r=[];s.groups.forEach(function(g){g.items.forEach(function(it){r.push(it);});});return r;}
function findItem(s,id){var a=items(s);for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i];}return null;}
function groupOf(s,it){for(var i=0;i<s.groups.length;i++){if(s.groups[i].items.indexOf(it)>=0)return s.groups[i];}return s.groups[0];}
function ref(s,it){return s.id+"/"+it.id;}
function getRef(r){var p=String(r).split("/");var s=S(p[0]);if(!s)return null;var it=findItem(s,p[1]);return it?{s:s,it:it}:null;}
function refName(r){var g=getRef(r);return g?g.it.id+" "+g.it.name:r;}
function linkTarget(f){return f.cfg&&f.cfg.sheet;}

/* ================= Values ================= */
function money(v){if(!v||v.a===""||v.a==null)return "";return (CURR[v.c]||v.c+" ")+fmtN(v.a,0);}
function toDays(v){return v&&v.n!==""&&v.n!=null?(+v.n)*(DUR_DAYS[v.u]||1):null;}
function recNext(v){if(!v||!v.n||!v.start)return "";var step=(+v.n)*(DUR_DAYS[v.u]||1);var s=dn(v.start),t=tdn();if(s>=t)return v.start;var k=Math.ceil((t-s)/step);return dnToStr(Math.round(s+k*step));}
function recText(v){if(!v||!v.n)return "";return "Every "+(+v.n===1?"":v.n+" ")+(+v.n===1?v.u.replace(/s$/,""):v.u)+(v.start?" · next "+fmtD(recNext(v)):"");}
function riskLevel(f,sc){var b=(f.cfg&&f.cfg.bands)||[4,9,15];return sc<=b[0]?{n:"Low",k:1}:sc<=b[1]?{n:"Medium",k:2}:sc<=b[2]?{n:"High",k:3}:{n:"Critical",k:4};}
function clStats(f,v){var lines=(f.cfg&&f.cfg.lines)||[],a=(v&&v.ans)||[];var r={total:lines.length,yes:0,no:0,na:0,open:0};lines.forEach(function(l,i){var x=a[i]&&a[i].a;if(x==="Yes")r.yes++;else if(x==="No")r.no++;else if(x==="N/A")r.na++;else r.open++;});r.pct=r.yes+r.no?Math.round(r.yes/(r.yes+r.no)*100):null;r.done=r.total?Math.round((r.total-r.open)/r.total*100):0;return r;}

function canEdit(f){if(DB.role==="Viewer")return false;if(f&&f.edit==="Admin"&&DB.role!=="Admin")return false;if(f&&f.lock==="values")return false;return true;}
function canBuild(){return DB.role==="Admin";}

function heatHtml(f,sc){var lv=riskLevel(f,sc);return '<span class="heat l'+lv.k+'" title="'+lv.n+'">'+sc+'</span>';}
function spark(v){if(!v||v.length<2)return "";var a=v.slice().sort(function(x,y){return x.d<y.d?-1:1;}).slice(-8);var mn=Math.min.apply(null,a.map(function(x){return +x.v;})),mx=Math.max.apply(null,a.map(function(x){return +x.v;}));var w=44,h=14;var pts=a.map(function(x,i){return (i*(w/(a.length-1))).toFixed(1)+","+(mx===mn?h/2:(h-((+x.v-mn)/(mx-mn))*h)).toFixed(1);}).join(" ");return '<svg class="spark" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';}
function stars(n,sc){var h="";for(var i=1;i<=sc;i++)h+='<i class="'+(i<=n?"on":"")+'"></i>';return '<span class="stars" title="'+n+" of "+sc+'">'+h+'</span>';}
function tlInner(v){if(!v||!v.a||!v.b)return "";var s=dn(v.a),e=dn(v.b),t=tdn();var pct=e<=s?(t>=s?100:0):Math.max(0,Math.min(100,(t-s)/(e-s)*100));return '<span class="tlb"><i style="width:'+pct+'%"></i><b>'+fmtD(v.a)+" – "+fmtD(v.b)+'</b></span>';}
function overdue(s,it,d){if(!d)return false;var st=statusField(s);if(st&&isDone(st,it.v[st.id]))return false;return dn(d)<tdn();}
function cellInner(s,f,it){
 if(!visible(s,f,it))return '<span class="mir">–</span>';
 if(masked(f))return isEmpty(it.v[f.id])?"":'<span class="mask">••••••</span>';
 var v=val(s,f,it);
 if(LABEL_T.indexOf(f.type)>=0)return esc(v||"");
 switch(f.type){
  case "dropdown":case "role":case "team":case "country":case "entity":return v?'<span class="dd">'+esc(v)+'</span>':"";
  case "multiselect":return (v||[]).map(function(t){return '<span class="tg">'+esc(t)+'</span>';}).join("");
  case "pdmarker":return (v||[]).map(function(t){var sp=PD_CATS.some(function(c){return c[0]===t&&c[1];});return '<span class="tg'+(sp?" sp":"")+'">'+esc(t)+'</span>';}).join("");
  case "people":return '<span class="avs">'+(v&&v.length?v.map(av).join(""):'<span class="av" style="background:none;border:1.5px dashed var(--line)"></span>')+'</span>';
  case "text":case "email":case "phone":case "justification":return esc(v||"");
  case "url":return v?esc(String(v).replace(/^https?:\/\//,"")):"";
  case "longtext":return esc(String(v||"").split("\n")[0]);
  case "comment":return v&&v.txt?esc(v.txt):"";
  case "number":return isEmpty(v)?"":fmtN(v)+(f.unit?' <span class="mir">'+esc(f.unit)+'</span>':"");
  case "value":return esc(money(v));
  case "percent":return isEmpty(v)?"":'<span class="pg"><span class="bar"><i style="width:'+Math.max(0,Math.min(100,v))+'%"></i></span><span class="num">'+v+'%</span></span>';
  case "duration":return v&&v.n!==""&&v.n!=null?esc(v.n+" "+v.u):"";
  case "date":if(!v)return "";return '<span class="'+(overdue(s,it,v)?"od":"")+'">'+fmtD(v)+'</span>';
  case "datetime":return v?fmtDT(v):"";
  case "timeline":return tlInner(v);
  case "recurrence":return esc(recText(v));
  case "rating":return isEmpty(v)?"":stars(+v,+f.cfg.scale||5);
  case "location":return esc(fmtV(f,v));
  case "check":return '<span class="cb'+(v?" on":"")+'"></span>';
  case "requirement":case "controllink":case "link":if(!v||!v.length)return "";return v.slice(0,2).map(function(r){var g=getRef(r);return '<span class="rl" title="'+esc(refName(r))+'">'+esc(g?g.it.id:r)+'</span>';}).join("")+(v.length>2?'<span class="rl">+'+(v.length-2)+'</span>':"");
  case "evidence":if(!v||!v.length)return '<span class="mir">No evidence</span>';var w=evWorst(v);return '<span class="fdot '+w+'"></span>'+v.length+" · "+(w==="bad"?"expired":w==="exp"?"expiring":"current");
  case "attachment":return v&&v.length?v.length+" file"+(v.length>1?"s":""):"";
  case "signature":if(!v||!v.by)return '<span class="mir">Not signed</span>';var bad=f.cfg.resign&&v.h&&v.h!==sigHash(s,it,f);return (bad?'<span class="od">Changed since signing</span>':av(v.by)+' <span>'+esc(v.meaning)+'</span>');
  case "ack":var aud=ackAudience(f);var n=(v||[]).filter(function(a){return aud.indexOf(a.p)>=0;}).length;return n+" / "+aud.length;
  case "applicability":return v&&v.a?'<span class="dd">'+esc(v.a)+'</span>':"";
  case "checklist":var c=clStats(f,v);if(!c.total)return "";return '<span class="pg"><span class="bar'+(c.no?" crit":c.open?"":" good")+'"><i style="width:'+c.done+'%"></i></span><span class="num">'+(c.total-c.open)+"/"+c.total+(c.no?" · "+c.no+" No":"")+'</span></span>';
  case "question":return v&&v.ans?esc(v.ans)+' <span class="mir">('+qScore(f,v)+')</span>':"";
  case "riskmatrix":return v&&v.l&&v.i?heatHtml(f,v.l*v.i):"";
  case "measurement":var l=lastM(v);if(!l)return "";var tg=f.cfg.target!==""&&f.cfg.target!=null?+f.cfg.target:null;var ok=tg==null?null:(f.cfg.dir==="up"?+l.v>=tg:+l.v<=tg);return '<span class="'+(ok===false?"od":"")+'">'+fmtN(l.v)+(f.cfg.unit?" "+esc(f.cfg.unit):"")+'</span> '+spark(v);
  case "clock":return '<span class="clk '+v.state+'">'+esc(v.txt)+'</span>';
  case "protected":return isEmpty(v)?"":'<span class="mask">••••••</span>';
  case "retention":return esc(fmtV(f,v,s,it));
  case "version":return v?'<span class="mono">'+esc(v)+'</span>':"";
  case "lookup":return esc((v||[]).join(", "));
  case "rollup":return isEmpty(v)&&v!==0?"":esc(fmtN(v)+(f.unit?" "+f.unit:""));
  case "formula":return esc(typeof v==="number"?fmtN(v):v);
  case "progress":return isEmpty(v)&&v!==0?"":'<span class="pg"><span class="bar'+(v>=100?" good":"")+'"><i style="width:'+v+'%"></i></span><span class="num">'+v+'%</span></span>';
  case "autoid":return '<span class="mono">'+esc(it.id)+'</span>';
  case "meta":return v&&v.who?av(v.who)+' <span class="mir">'+esc(v.at)+'</span>':"";
  case "button":return '<span class="cbtn">'+esc(f.cfg.label||"Run")+'</span>';
  case "ai":return v&&v.prop?'<span class="mir">AI: </span>'+esc(v.prop.slice(0,60)):'<span class="mir">Suggest</span>';
 }
 return esc(fmtV(f,v,s,it));

 function bar(name,c,v,m,lbl){return '<div class="chb"><span>'+esc(name)+'</span><span class="tr"><i class="lb-'+c+'" style="width:'+(v/m*100)+'%"></i></span><b class="num">'+lbl+'</b></div>';}

function fieldVal(s,f,it){if(masked(f))return isEmpty(it.v[f.id])?"":'<span class="mask">••••••</span> <span class="note">Restricted</span>';

 if(f.type==="evidence")return (v||[]).map(function(e){return '<span class="chip line"><span class="fdot '+evFresh(e)+'"></span>'+esc(e.name)+(e.exp?" · until "+fmtD(e.exp):"")+'</span>';}).join(" ")||'<span class="mir">No evidence</span>';
 if(f.type==="signature"&&v&&v.by)return cellInner(s,f,it)+' <span class="note">'+esc(pname(v.by))+", "+esc(v.at)+'</span>';
 if(f.type==="ack"){var aud=ackAudience(f);return aud.map(function(p){var a=(v||[]).find(function(x){return x.p===p;});return '<span class="chip '+(a?"good":"")+'">'+esc(pname(p))+(a?" ✓":"")+'</span>';}).join(" ");}
 if(f.type==="checklist"){var c=clStats(f,v);return cellInner(s,f,it)+(c.pct!=null?' <span class="note">'+c.pct+'% conformity</span>':"");}
 if(f.type==="riskmatrix")return v&&v.l?heatHtml(f,v.l*v.i)+' <span class="note">L'+v.l+" × I"+v.i+" · "+riskLevel(f,v.l*v.i).n+'</span>':"";
 if(f.type==="measurement"){var l=lastM(v);return l?cellInner(s,f,it)+' <span class="note">'+(v.length)+" readings"+(f.cfg.target!==""?" · target "+f.cfg.target:"")+'</span>':"";}
 if(f.type==="ai")return v&&v.prop?esc(v.prop)+' <span class="chip '+(v.state==="accepted"?"good":v.state==="rejected"?"crit":"warn")+'">'+esc(v.state||"proposed")+'</span>':'<span class="mir">No proposal yet</span>';
 if(f.type==="applicability")return v&&v.a?'<span class="dd">'+esc(v.a)+'</span>'+(v.why?" "+esc(v.why):""):"";
 return cellInner(s,f,it);
}

var toastT=null;
function toast(msg,kind){var t=document.getElementById("toast");t.textContent=msg;t.className="on"+(kind?" "+kind:"");clearTimeout(toastT);toastT=setTimeout(function(){t.className="";},Math.min(9000,3500+msg.length*25));}
function arm(key,btn,label){if(UI.arm===key){UI.arm=null;return true;}UI.arm=key;if(btn){btn.classList.add("armed");btn.textContent=label||"Click again to confirm";}setTimeout(function(){if(UI.arm===key)UI.arm=null;},4000);return false;}
function refresh(){renderSide();if(UI.route.indexOf("s/")===0)renderView();else renderRoute(true);if(UI.dctx)renderDrawer();if(UI.modal&&UI.modal.kind==="auto")renderAutoModal();}
function defaultVal(f){var d=f.def;if(d===""||d==null)return "";
 if(f.type==="date"){if(d==="today")return todayStr();var m=/^\+(\d+)$/.exec(d);return m?dOff(+m[1]):d;}
 if(f.type==="people")return d==="me"?[DB.me]:[d];if(f.type==="check")return d==="1"||d===true;if(f.type==="number"||f.type==="percent")return +d;return d;}

/* ================= Setting values ================= */
function snapshotNums(s,it){var m={};DB.autos.forEach(function(a){if(a.sheet===s.id&&(a.trig.type==="above"||a.trig.type==="below")){var f=fld(s,a.trig.f);if(f)m[f.id]=numOf(s,f,it);}});return m;}
function setVal(s,f,it,nv,o){
 o=o||{};var sys=!!o.actor,actor=o.actor||pname(DB.me);
 if(it.draft){it.v[f.id]=nv;renderView();return {ok:1};}
 var old=it.v[f.id];if(JSON.stringify(old==null?"":old)===JSON.stringify(nv==null?"":nv))return {same:1};
 if(!sys){if(!canEdit(f)){toast("As "+DB.role+" you can’t edit “"+f.name+"”.","crit");return {block:"permission"};}if(it.locked){toast("Locked: "+it.id+" can’t be changed. Unlock it from the item panel (Admin).","crit");return {block:"locked"};}}
 else if(it.locked&&!o.bypass){return {block:"item locked"};}
 if(f.rules&&f.rules.length&&!o.bypass){var rr=f.rules.find(function(r){return r.label===nv;});if(rr){var nf=fld(s,rr.needs);if(nf&&isEmpty(it.v[nf.id])){var m="Status rule: “"+nv+"” needs “"+nf.name+"” first.";if(!o.quiet)toast(m,"crit");return {block:m};}}}
 var pre=snapshotNums(s,it);var oldTxt=f.enc?"(restricted)":fmtV(f,old,s,it);
 it.v[f.id]=nv;it.upd={who:sys?"AU":DB.me,at:stamp()};
 var newTxt=f.enc?"(restricted)":fmtV(f,nv,s,it);
 it.log.push({t:stamp(),who:actor,txt:f.name+": "+(oldTxt||"empty")+" → "+(newTxt||"empty")});
 var msgs=fire(s,it,{type:"change",f:f.id,old:old,nv:nv,pre:pre},o.depth||0);
 save();
 if(!o.quiet){refresh();toast(msgs.length?msgs.join(" · "):"Saved. "+f.name+" on "+it.id+" is in the change history.");}
 return {msgs:msgs};
}

function fire(s,it,ev,depth){depth=depth||0;var out=[];

function trigMatch(a,s,it,ev){var t=a.trig;switch(t.type){

  if(Array.isArray(ev.nv))return ev.nv.indexOf(t.val)>=0&&!(Array.isArray(ev.old)&&ev.old.indexOf(t.val)>=0);

 case "above":case "below":if(ev.type!=="change")return false;var nf=fld(s,t.f);if(!nf)return false;var before=ev.pre?ev.pre[nf.id]:null;var after=numOf(s,nf,it);if(after==null)return false;
  return t.type==="above"?(after>+t.n&&!(before!=null&&before>+t.n)):(after<+t.n&&!(before!=null&&before<+t.n));

 case "checklistno":if(ev.type!=="change"||ev.f!==t.f)return false;var cf=fld(s,t.f);return clStats(cf,ev.nv).no>clStats(cf,ev.old).no;
 case "dateis":case "clock":case "evidence":return ev.type==="sched"&&ev.a===a.id;
}return false;}

function runScheduler(manual){var out=[];DB.fired=DB.fired||{};
