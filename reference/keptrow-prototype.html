<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keptrow prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Keptrow in the Betelos design language: navy rail, blue accents, navy hero with overlapping cards, take-action banner, widget cards, assistant panel. */
:root{--navy:#00005E;--blue:#0000A0;--light:#DCEDFF;--bg:#F2F4F8;--panel:#F4F8FD;--muted:#474748;--line:#E3E3E3;--green:#0B6B43;--red:#B3261E;--orange:#E07B00;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:'Figtree',Arial,sans-serif;color:#000;background:var(--bg);font-size:15px;line-height:1.4}
a{color:var(--blue)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3B6FE0;outline-offset:2px}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:12px 24px}
.logo{font-size:28px;font-weight:600;color:var(--blue);letter-spacing:-.5px;flex:0 0 288px;background:none;border:0;text-align:left;cursor:pointer;padding:0;display:flex;align-items:center;gap:10px}
.search{flex:1 1 260px;max-width:520px;position:relative}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid #8A8A8C;padding:0 20px 0 46px;background:#fff}
.search svg{position:absolute;left:16px;top:12px;color:var(--muted)}
.top-right{margin-left:auto;display:flex;gap:12px;align-items:center}
.ghostbtn{height:44px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:var(--navy);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;position:relative}
.ghostbtn .pip{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:999px;background:var(--orange);border:2px solid #fff}
.userbtn{height:44px;padding:0 20px 0 6px;border-radius:999px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:500;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:16px}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--light);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.avatar.sm{width:26px;height:26px;font-size:11px}
.avatar.bot{background:var(--navy);color:#fff}
.layout{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 69px)}
.rail{flex:0 0 80px;background:var(--navy);padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.rail-btn{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;background:transparent;border:0;cursor:pointer}
.rail-btn.on{background:var(--light);color:var(--navy)}
.rail-btn.outline{border:1px solid rgba(255,255,255,.35)}
.rail-sep{width:32px;height:1px;background:rgba(255,255,255,.25);margin:4px 0}
.panel{flex:1 1 232px;background:var(--panel);border-right:1px solid var(--line);padding:28px 16px 40px;display:flex;flex-direction:column;gap:4px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px 16px}
.panel-head h2{margin:0;font-size:20px;font-weight:600;color:var(--navy)}
.panel-sec{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 16px 4px}
.nav-item{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;font-size:16px;color:var(--navy);background:none;border:0;cursor:pointer;text-align:left;width:100%}
.nav-item.on{color:var(--blue);font-weight:700}
.nav-item:hover{text-decoration:underline}
.nav-count{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.nav-count.late{color:#9B1C14;font-weight:700}
.panel-foot{margin-top:auto;padding:24px 16px 0;font-size:13px;color:var(--muted)}
.content{flex:999 1 560px;min-width:0}
.hero{background:var(--navy);position:relative;overflow:hidden}
.hero-deco{position:absolute;right:-60px;top:-80px}
.hero-in{padding:32px 48px 120px;position:relative;display:flex;flex-direction:column;gap:12px}
.hero h1{margin:0;font-size:40px;line-height:1.15;font-weight:600;color:#fff;letter-spacing:-.5px}
.hero p{margin:0;color:var(--light);font-size:17px;max-width:760px}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--light)}
.crumbs button{background:none;border:0;padding:0;color:var(--light);text-decoration:underline;cursor:pointer;font-size:14px}
.crumbs span.cur{color:#fff}
.page{margin:-88px 0 0;padding:0 48px 80px;position:relative;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.main-col{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px}
.full-col{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:24px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,94,.08);padding:20px 24px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.card h2{margin:0;font-size:18px;font-weight:600}
.card h3{margin:0;font-size:16px;font-weight:600}
.sub{font-size:14px;color:var(--muted)}
.summary{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:24px 32px}
.summary .grow{flex:999 1 280px;min-width:0;display:flex;flex-direction:column;gap:4px}
.big{font-size:28px;font-weight:600}
.facts{flex:1 1 220px;margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
.facts dt{color:var(--muted)} .facts dd{margin:0;color:var(--navy);font-weight:500}
.actions{display:flex;gap:12px;flex-wrap:wrap;padding-top:14px}
.btn{height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:2px solid var(--blue);background:#fff;color:var(--blue);white-space:nowrap}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-width:1px}
.btn.xs{height:32px;padding:0 12px;font-size:13px;border-width:1px}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;text-align:left;font-size:inherit}
.linkbtn.title{font-weight:500;font-size:15px}
.badge{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap;display:inline-block}
.b-blue{background:var(--light);color:var(--navy)}.b-orange{background:#FFF1DC;color:#7A4100}.b-red{background:#FDE7E6;color:#9B1C14}.b-green{background:#E3F4EE;color:#0B5A42}.b-grey{background:var(--bg);color:var(--muted)}
.barwrap{display:flex;align-items:center;gap:10px;min-width:120px}
.bar{height:6px;border-radius:999px;background:var(--light);overflow:hidden;flex:1}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--blue)}
.pct{font-size:14px;font-weight:600;width:40px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--bg);text-align:left;padding:12px 14px;font-weight:600;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right}
.scroll{overflow-x:auto}
.icon-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:500;cursor:pointer;font-size:14px}
.pill.on{background:var(--blue);color:#fff}
.chev{width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.chev.closed svg{transform:rotate(180deg)}
.overdue{color:var(--red);font-weight:600}
.pos{color:var(--green);font-weight:600}.neg{color:var(--red);font-weight:600}
.list-row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.datechip{width:48px;flex:none;text-align:center;color:var(--navy);background:var(--light);border-radius:8px;padding:6px 0}
.datechip b{display:block;font-size:18px;font-weight:600}.datechip i{font-style:normal;font-size:11px;font-weight:600}
.datechip.late{background:#FDE7E6;color:#9B1C14}
.empty{padding:20px 0;color:var(--muted)}
.utabs{display:flex;gap:28px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.utabs button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 0 12px;font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-height:44px;margin-bottom:-1px}
.utabs button.on{color:var(--navy);border-bottom-color:var(--blue)}
.switch{height:40px;padding:0 14px 0 6px;border-radius:999px;border:1px solid #8A8A8C;background:#fff;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.switch .knob{width:44px;height:26px;border-radius:999px;background:#C9CDD4;position:relative}
.switch .knob:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:#fff;transition:left .15s}
.switch.on{border-color:var(--blue);color:var(--navy)}.switch.on .knob{background:var(--blue)}.switch.on .knob:after{left:21px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:16px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:8px}
.kpi-v{font-size:22px;font-weight:600}
.plan-head{display:flex;flex-direction:column;gap:14px}
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ph-id{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.plan-select{height:44px;border:1px solid #8A8A8C;border-radius:4px;padding:0 12px;font-size:17px;font-weight:600;color:var(--navy);background:#fff;max-width:100%}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap}
.ph-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ph-bottom .utabs{flex:1 1 auto;border-bottom:0}
.ph-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:10px}
.minisearch{height:40px;border:1px solid #8A8A8C;border-radius:999px;padding:0 14px;min-width:200px;background:#fff}
/* overview banner, widgets, assistant */
.ov{background:#0000A0;border-radius:8px;color:#fff;padding:24px 32px;display:flex;gap:40px;flex-wrap:wrap}
.ov h2{margin:0 0 14px;font-size:18px;font-weight:600}
.ov-left{flex:999 1 460px;min-width:0}.ov-right{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:10px}
.ov-chart{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.ov-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-weight:500}
.ov-legend li{display:flex;align-items:center;gap:10px}.ov-legend span{width:12px;height:12px;border-radius:999px;display:inline-block}
.ov-act{display:flex;align-items:center;gap:12px;background:#2A2AB5;border:0;border-radius:6px;color:#fff;padding:0 18px;min-height:52px;text-align:left;cursor:pointer;font-weight:500;font-size:15px}
.ov-act:hover{background:#3535C2}.ov-act span{flex:1}.ov-act b{font-size:12px;letter-spacing:.06em}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:24px}
.widget{min-width:0}.widget.wide{grid-column:1/-1}
.w-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.w-head h2{margin:0}.w-icons{margin-left:auto;display:flex;gap:2px}
.w-ic{width:44px;height:44px;border:0;background:none;border-radius:999px;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.w-ic:hover{background:var(--light)}
.sumbox{width:100%;border:1px solid #DCE3EC;border-radius:4px;background:#fff;padding:14px 56px 14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;cursor:pointer}
.sumbox:hover{border-color:var(--blue)}.sumv{font-size:26px;font-weight:600;color:#000}
.sum-chev{position:absolute;right:16px;top:50%;margin-top:-11px;color:#000}
.assist{flex:1 1 340px;max-width:400px;min-width:0;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,94,.08);align-self:flex-start;position:sticky;top:16px;min-height:min(680px,calc(100vh - 32px));max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.a-body{overflow:auto}
.dwrap{position:relative;display:inline-block;width:100%}.dhide{position:absolute;left:0;bottom:0;opacity:0;width:1px;height:1px;pointer-events:none}.dwrap.show .dhide{position:static;opacity:1;width:100%;height:36px;pointer-events:auto}.dwrap.show .dbtn{display:none}.dbtn{text-align:left;white-space:nowrap;cursor:pointer}
.a-tabs{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:0 8px 0 16px}
.a-tabs [role=tab]{background:none;border:0;border-bottom:3px solid transparent;padding:16px 12px 13px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.a-tabs [role=tab].on{color:var(--blue);border-bottom-color:var(--blue)}.a-tabs .w-ic{margin-left:auto}
.a-body{padding:16px;display:flex;flex-direction:column;justify-content:flex-end;flex:1;gap:12px}
.a-bubble{background:#E5F0FD;border-radius:8px;padding:18px;color:var(--navy)}
.a-bubble p{margin:8px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#D4DDE8;border:0;border-radius:4px;padding:0 12px;min-height:36px;font-size:13px;font-weight:600;color:#1F2937;cursor:pointer}
.chip:hover{background:#C3CFDD}
.a-input{display:flex;gap:8px}
.a-input input{flex:1;min-width:0;height:44px;border:1px solid #8A8A8C;border-radius:4px;padding:0 12px}
.a-msg{align-self:flex-end;background:var(--bg);border-radius:8px;padding:10px 14px;max-width:85%}
/* task tiles (from nordea.no: entry points by intent) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px}
.tile{background:#fff;border:0;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,94,.08);padding:18px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:118px;position:relative}
.tile:hover{box-shadow:0 0 0 2px var(--blue)}
.tile b{color:var(--navy);font-size:17px;font-weight:600;padding-right:28px}
.tile span{color:var(--muted);font-size:14px}
.tile svg.go{position:absolute;right:16px;top:18px;color:var(--blue)}
.tile .ti{width:40px;height:40px;border-radius:999px;background:var(--light);color:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.qlinks{list-style:none;margin:0;padding:0}
.qlinks li{border-top:1px solid var(--line)}.qlinks li:first-child{border-top:0}
.qlinks button{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;background:none;border:0;cursor:pointer;color:var(--navy);font-weight:500;text-align:left;padding:0}
.qlinks button span{flex:1}.qlinks button:hover span{text-decoration:underline}
.newcard{background:var(--panel);border-radius:8px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
/* sheet grid */
.grp{margin-top:20px}
.grp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0}
.grp-h h3{margin:0;font-size:17px;color:var(--navy)}
.gtable{min-width:900px;font-size:14px}
.gtable th{font-size:13px;padding:10px 10px;border-bottom:1px solid var(--line)}
.gtable td{padding:6px 10px;border-bottom:1px solid var(--line);height:52px}
.gtable td:first-child,.gtable th:first-child{border-left:4px solid var(--gc,var(--blue))}
.gtable tr:hover td{background:#FAFBFE}
.itemcell{display:flex;align-items:center;gap:10px;min-width:260px}
.iid{font:500 12px/1 var(--mono);color:var(--muted);white-space:nowrap}
.cellin{height:36px;border:1px solid transparent;border-radius:4px;background:transparent;padding:0 8px;width:100%;min-width:110px;color:#000}
.cellin:hover{border-color:#C9CDD4;background:#fff}
.cellin:focus{background:#fff;border-color:var(--blue)}
.cellin.late{color:var(--red);font-weight:600}
select.cellin{cursor:pointer}
.sbtn{border:0;border-radius:999px;min-height:32px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:120px}
.sb-grey{background:#E8EAEE;color:var(--muted)}.sb-orange{background:#FFE2B8;color:#5C3300}.sb-blue{background:var(--light);color:var(--navy)}.sb-green{background:#CDEBDD;color:#0B5A42}.sb-red{background:#FDE7E6;color:#9B1C14}
.sev{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.sev i{width:10px;height:10px;border-radius:2px;display:inline-block}
.evbtn{background:none;border:1px dashed #8A8A8C;border-radius:999px;min-height:32px;padding:0 12px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.evbtn.has{border:0;background:#E3F4EE;color:#0B5A42;font-weight:600}
.tagchip{display:inline-block;font-size:12px;font-weight:600;color:var(--navy);background:var(--light);border-radius:999px;padding:3px 9px;margin:2px 4px 2px 0;white-space:nowrap}
.grp-foot{display:flex;align-items:center;gap:14px;padding:10px 0 4px;flex-wrap:wrap}
.distbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--bg);flex:0 1 260px;min-width:160px}
.quick{display:flex;gap:8px;padding:8px 0 0;max-width:560px}
.quick input{flex:1;height:40px;border:1px solid #8A8A8C;border-radius:4px;padding:0 12px;min-width:0}
.clock{font-weight:600;font-size:13px}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start;margin-top:16px}
.kcol{background:#E8EDF5;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kcol h3{margin:0 4px;font-size:15px;color:var(--navy);display:flex;justify-content:space-between}
.kcard{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,94,.08);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
/* drawer */
.dscrim{position:fixed;inset:0;background:rgba(0,0,40,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,40,.18)}
.dr-head{background:var(--navy);color:#fff;padding:18px 20px 0;display:flex;flex-direction:column;gap:10px}
.dr-top{display:flex;align-items:center;gap:10px}
.dr-top .iid{color:var(--light)}
.dr-top .w-ic{color:#fff;margin-left:auto}.dr-top .w-ic:hover{background:rgba(255,255,255,.12)}
.dr-title{background:transparent;border:1px solid transparent;color:#fff;font-size:22px;font-weight:600;padding:4px 6px;margin:0 -6px;border-radius:4px;width:100%}
.dr-title:hover,.dr-title:focus{border-color:rgba(255,255,255,.4)}
.dr-tabs{display:flex;gap:4px}
.dr-tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--light);font-weight:600;padding:10px 12px;cursor:pointer}
.dr-tabs button.on{color:#fff;border-bottom-color:#fff}
.dr-body{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.frow{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;min-height:44px}
.frow>label,.frow>span.lab{color:var(--muted);font-size:14px}
.frow .cellin{border-color:#C9CDD4;background:#fff}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.hash{font:500 12px/1.3 var(--mono);color:var(--muted)}
.subrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.subrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}
/* automations */
.auto{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.auto .sent{flex:999 1 420px;font-size:17px;line-height:1.6;color:#000}
